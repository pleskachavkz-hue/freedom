<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedom Chat</title>
    <!-- Подключаем Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0a0a;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
        }
        /* Контейнер чата со скруглёнными краями */
        #chat-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: #1e1e1e;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            border: 1px solid #2c2c2e;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        /* Шапка чата */
        #chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: #111;
            border-bottom: 1px solid #2c2c2e;
            font-size: 0.95rem;
            z-index: 2;
        }
        #header-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #current-user-display {
            font-weight: 600;
            color: #fff;
        }
        #online-count {
            font-size: 0.75rem;
            color: #30d158;
            font-weight: 500;
        }
        #logout-button {
            background: none;
            border: none;
            color: #ff453a;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        #logout-button:hover {
            opacity: 0.7;
        }
        /* Панель поиска */
        #search-bar {
            background: #1a1a1c;
            padding: 8px 15px;
            border-bottom: 1px solid #2c2c2e;
            display: none; /* Покажется после авторизации */
        }
        #search-input {
            width: 100%;
            padding: 8px 14px;
            border-radius: 10px;
            border: none;
            background: #2c2c2e;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }
        /* Область сообщений */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
        }
        .message.own {
            background-color: #007aff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.other {
            background-color: #2c2c2e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message-meta {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        /* Панель ввода */
        #bottom-bar {
            position: relative;
            background: #111;
            padding: 15px 15px 22px 15px;
            border-top: 1px solid #2c2c2e;
        }
        #input-container {
            display: flex;
            gap: 10px;
            position: relative;
        }
        #message-input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 22px;
            border: none;
            background: #2c2c2e;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        #send-button {
            background: #007aff;
            color: #fff;
            border: none;
            padding: 0 22px;
            border-radius: 22px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        #send-button:hover {
            background: #0063cc;
        }
        /* Встроенный индикатор печатания */
        #typing-status {
            position: absolute;
            bottom: 4px;
            left: 32px;
            font-size: 0.75rem;
            opacity: 0.5;
            font-style: italic;
            color: #fff;
            pointer-events: none;
            height: 14px;
            line-height: 14px;
        }
        /* Окно авторизации */
        #auth-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 10;
            display: none;
            border-radius: 24px;
        }
        #auth-overlay h2 {
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 1.4rem;
        }
        #username-input {
            width: 100%;
            max-width: 300px;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #2c2c2e;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }
        #login-button {
            width: 100%;
            max-width: 300px;
            background: #007aff;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #login-button:hover {
            background: #0063cc;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <!-- Шапка чата -->
        <div id="chat-header">
            <div id="header-info">
                <span id="current-user-display">Загрузка...</span>
                <span id="online-count">онлайн: 0</span>
            </div>
            <button id="logout-button">Выйти</button>
        </div>

        <!-- Поиск по истории -->
        <div id="search-bar">
            <input type="text" id="search-input" placeholder="Поиск по сообщениям...">
        </div>

        <!-- Окно ввода имени -->
        <div id="auth-overlay">
            <h2>Представьтесь</h2>
            <input type="text" id="username-input" placeholder="Ваше имя..." maxlength="20" autocomplete="off">
            <button id="login-button">Войти в чат</button>
        </div>

        <!-- Список сообщений -->
        <div id="messages"></div>

        <!-- Нижний блок управления -->
        <div id="bottom-bar">
            <div id="input-container">
                <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
                <button id="send-button">Отправить</button>
            </div>
            <div id="typing-status"></div>
        </div>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ FIREBASE ---
        const firebaseConfig = { databaseURL: "https://freedom-9cedb-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);

        const db = firebase.database().ref('chat_messages');
        const typingRef = firebase.database().ref('typing');
        const onlineRef = firebase.database().ref('online_users');

        const messagesBox = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const logoutButton = document.getElementById('logout-button');
        const authOverlay = document.getElementById('auth-overlay');
        const usernameInput = document.getElementById('username-input');
        const loginButton = document.getElementById('login-button');
        const currentUserDisplay = document.getElementById('current-user-display');
        const onlineCountSpan = document.getElementById('online-count');
        const searchBar = document.getElementById('search-bar');
        const searchInput = document.getElementById('search-input');

        let username = localStorage.getItem('chat_username');
        let lastMessageDateString = '';
        let typingTimeout;
        let localMessagesCache = []; // Хранилище для мгновенного локального поиска

        // --- ПРОВЕРКА АВТОРИЗАЦИИ ---
        function checkAuth() {
            if (!username) {
                authOverlay.style.display = 'flex';
                searchBar.style.display = 'none';
            } else {
                authOverlay.style.display = 'none';
                searchBar.style.display = 'block';
                currentUserDisplay.innerText = username;
                initChatListeners();
                initOnlinePresence();
            }
        }

        // Функция отправки системных сообщений
        function sendSystemMessage(text) {
            const systemMessage = {
                name: 'Система',
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                isSystem: true
            };
            db.push(systemMessage);
        }

        function handleLogin() {
            const name = usernameInput.value.trim();
            if (!name) return;
            username = name;
            localStorage.setItem('chat_username', username);
            checkAuth();
            
            sendSystemMessage(`Пользователь ${username} вошел в чат`);
        }

        loginButton.addEventListener('click', handleLogin);
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        // --- ЛОГИКА ВЫХОДА ---
        logoutButton.addEventListener('click', () => {
            if (username) {
                typingRef.child(username).set(false);
                onlineRef.child(username).remove();
                sendSystemMessage(`Пользователь ${username} покинул чат`);
            }
            localStorage.removeItem('chat_username');
            setTimeout(() => { location.reload(); }, 500);
        });

        // --- ФУНКЦИЯ ОТПРАВКИ СООБЩЕНИЯ ---
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !username) return;

            const newMessage = {
                name: username,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                views: { [username]: true }
            };

            db.push(newMessage);
            messageInput.value = '';
            clearTimeout(typingTimeout);
            typingRef.child(username).set(false);
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // --- ОТСЛЕЖИВАНИЕ ПЕЧАТАНИЯ ---
        messageInput.addEventListener('input', () => {
            if (!username) return;
            typingRef.child(username).set(true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                typingRef.child(username).set(false);
            }, 2500);
        });

        // --- СИСТЕМА ОНЛАЙН СТАТУСА (PRESENCE) ---
        function initOnlinePresence() {
            const amOnlineRef = firebase.database().ref('.info/connected');
            
            amOnlineRef.on('value', (snapshot) => {
                if (snapshot.val() === true) {
                    const userStatusRef = onlineRef.child(username);
                    // Когда юзер отключится (закроет вкладку) — автоматически удалить его из базы
                    userStatusRef.onDisconnect().remove();
                    userStatusRef.set(true);
                }
            });

            // Слушаем общее количество людей онлайн
            onlineRef.on('value', (snapshot) => {
                const totalOnline = snapshot.numChildren();
                onlineCountSpan.innerText = `онлайн: ${totalOnline}`;
            });
        }

        // --- ЛОКАЛЬНЫЙ ПОИСК ПО ИСТОРИИ ---
        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase().trim();
            
            localMessagesCache.forEach(item => {
                const element = document.getElementById(item.id);
                if (!element) return;

                // Если системное сообщение — ищем по тексту, иначе по автору и тексту
                const matches = item.isSystem 
                    ? item.text.toLowerCase().includes(query)
                    : item.text.toLowerCase().includes(query) || item.name.toLowerCase().includes(query);

                if (matches) {
                    element.style.display = '';
                } else {
                    element.style.display = 'none'; // Скрываем неподходящие под фильтр
                }
            });
        });

        // --- ИНИЦИАЛИЗАЦИЯ СЛУШАТЕЛЕЙ FIREBASE ---
        function initChatListeners() {
            // Слушаем, кто сейчас печатает
            typingRef.on('value', (snapshot) => {
                const typingUsers = snapshot.val() || {};
                const activeTypers = Object.keys(typingUsers).filter(name => name !== username && typingUsers[name] === true);
                const typingStatusDiv = document.getElementById('typing-status');
                
                if (activeTypers.length > 0) {
                    typingStatusDiv.innerText = activeTypers.length === 1 
                        ? `${activeTypers[0]} печатает...` 
                        : `${activeTypers.join(', ')} печатают...`;
                } else {
                    typingStatusDiv.innerText = '';
                }
            });

            // История последних 50 сообщений
            db.limitToLast(50).on('child_added', (snapshot) => {
                const messageId = snapshot.key;
                const data = snapshot.val();
                let timeString = '';
                let dateString = '';
                let isToday = false;

                if (data.timestamp) {
                    const date = new Date(data.timestamp);
                    timeString = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                    dateString = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
                    const todayString = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
                    if (dateString === todayString) isToday = true;
                }

                // Кэшируем для последующего поиска
                localMessagesCache.push({
                    id: data.isSystem ? `sys-${messageId}` : `msg-${messageId}`,
                    name: data.name || '',
                    text: data.text || '',
                    isSystem: !!data.isSystem
                });

                // Отметка о прочтении
                if (!data.isSystem && data.name !== username && (!data.views || !data.views[username])) {
                    db.child(messageId).child('views').child(username).set(true);
                }

                // Разделитель дат
                if (dateString && dateString !== lastMessageDateString) {
                    messagesBox.innerHTML += `
                        <div style="text-align: center; margin: 1.5rem 0 0.5rem; font-size: 0.8rem; opacity: 0.4; width: 100%;">
                            — ${isToday ? 'Сегодня' : dateString} —
                        </div>
                    `;
                    lastMessageDateString = dateString;
                }

                // Отрисовка
                if (data.isSystem) {
                    messagesBox.innerHTML += `
                        <div id="sys-${messageId}" style="text-align: center; margin: 0.5rem 0; font-size: 0.85rem; opacity: 0.6; font-style: italic; width: 100%; color: #007aff;">
                            ${data.text} (${timeString})
                        </div>
                    `;
                } else {
                    const messageClass = data.name === username ? 'own' : 'other';
                    const viewsCount = data.views ? Object.keys(data.views).length : 1;
                    const ticks = viewsCount > 1 ? '✓✓' : '✓';
                    const statusTicks = messageClass === 'own' ? `<span class="ticks" style="margin-left: 5px; opacity: 0.6;">${ticks}</span>` : '';

                    messagesBox.innerHTML += `
                        <div id="msg-${messageId}" class="message ${messageClass}">
                            <div class="message-meta">
                                <span>${data.name}</span>
                                <span>${timeString}${statusTicks}</span>
                            </div>
                            <div>${data.text}</div>
                        </div>
                    `;
                }

                // Автоматический скролл вниз, только если пользователь не ищет что-то в данный момент
                if (!searchInput.value.trim()) {
                    messagesBox.scrollTop = messagesBox.scrollHeight;
                }
            });

            // Слушаем изменения галочек
            db.limitToLast(50).on('child_changed', (snapshot) => {
                const messageId = snapshot.key;
                const data = snapshot.val();
                
                if (data.isSystem) return;

                const msgElement = document.getElementById(`msg-${messageId}`);
                if (msgElement && data.name === username) {
                    const viewsCount = data.views ? Object.keys(data.views).length : 1;
                    const ticks = viewsCount > 1 ? '✓✓' : '✓';
                    const ticksSpan = msgElement.querySelector('.ticks');
                    if (ticksSpan) ticksSpan.innerText = ticks;
                }
            });
        }

        checkAuth();
    </script>
</body>
</html>
